<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VizAI Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background: #181a20; color: #f5f6fa; }
        .dashboard-container { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px;
            background: #23272b;
            padding: 1.5rem 1rem;
            border-right: 2px solid #222;
        }
        .main-content { flex: 1; padding: 2rem; }
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
        }
        .chart-card {
            background: #23272b;
            border-radius: 1.2rem;
            box-shadow: 0 2px 12px 0 rgba(79,140,255,0.09);
            padding: 1.2rem;
            position: relative;
        }
        .chart-actions {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }
        .draggable {
            cursor: move;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h4 style="color:#7ecbff; font-weight:700;">📌 Pinned Charts</h4>
            <ul id="pinned-list" class="list-group mb-4">
                <!-- Dynamically filled with pinned chart names -->
            </ul>
            <button class="btn btn-primary w-100 mb-2" onclick="window.location.href='/'">+ Add More Charts</button>
            <button class="btn btn-outline-secondary w-100" onclick="clearDashboard()">Clear Dashboard</button>
        </div>
        <div class="main-content">
            <h2 class="mb-4" style="color:#7ecbff; font-weight:700;">📊 Interactive Dashboard</h2>
            <div class="chart-grid" id="dashboard-grid">
                <!-- Chart cards will be rendered here -->
            </div>
        </div>
    </div>
    <script>
        // Load pinned charts from localStorage and render them
        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            const pinned = JSON.parse(localStorage.getItem('vizai_pinned_charts') || '[]');
            grid.innerHTML = '';
            pinned.forEach((chart, idx) => {
                const card = document.createElement('div');
                card.className = 'chart-card draggable';
                card.setAttribute('draggable', 'true');
                card.setAttribute('data-idx', idx);
                card.innerHTML = `
                    <div class="chart-actions">
                        <button class="btn btn-sm btn-danger" onclick="removeChart(${idx})">Remove</button>
                    </div>
                    <h5 style="color:#7ecbff;">${chart.chartType}</h5>
                    <div><b>X:</b> ${chart.xAxis || 'N/A'} <b>Y:</b> ${chart.yAxis || 'N/A'}</div>
                    <div class="chart-img-container" style="margin-top:1rem; background:#222; border-radius:0.7rem; min-height:180px; display:flex; align-items:center; justify-content:center;">
                        <img src="" alt="Chart" style="max-width:100%; max-height:180px; display:none;">
                        <span class="loading-msg" style="color:#888;">Loading chart...</span>
                    </div>
                `;
                grid.appendChild(card);
                // Fetch and display chart image
                const img = card.querySelector('img');
                const loadingMsg = card.querySelector('.loading-msg');
                fetch('/api/chart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(chart)
                })
                .then(res => {
                    if (res.headers.get('Content-Type') && res.headers.get('Content-Type').includes('application/json')) {
                        return res.json().then(err => { throw new Error(err.error || 'Failed to load chart'); });
                    }
                    if (!res.ok) throw new Error('Failed to load chart');
                    return res.blob();
                })
                .then(blob => {
                    img.src = URL.createObjectURL(blob);
                    img.style.display = 'block';
                    loadingMsg.style.display = 'none';
                })
                .catch((err) => {
                    loadingMsg.textContent = 'Failed to load chart: ' + err.message;
                });
            });
            // Update sidebar
            const pinnedList = document.getElementById('pinned-list');
            pinnedList.innerHTML = '';
            pinned.forEach((chart, idx) => {
                const li = document.createElement('li');
                li.className = 'list-group-item bg-dark text-light';
                li.textContent = `${chart.chartType} (${chart.xAxis || ''}${chart.yAxis ? ' vs ' + chart.yAxis : ''})`;
                pinnedList.appendChild(li);
            });
        }
        function removeChart(idx) {
            let pinned = JSON.parse(localStorage.getItem('vizai_pinned_charts') || '[]');
            pinned.splice(idx, 1);
            localStorage.setItem('vizai_pinned_charts', JSON.stringify(pinned));
            renderDashboard();
        }
        function clearDashboard() {
            localStorage.removeItem('vizai_pinned_charts');
            location.reload();
        }
        // Drag and drop rearrange (basic)
        let dragSrcIdx = null;
        document.addEventListener('dragstart', function(e) {
            if (e.target.classList.contains('draggable')) {
                dragSrcIdx = e.target.getAttribute('data-idx');
            }
        });
        document.addEventListener('dragover', function(e) {
            if (e.target.classList.contains('draggable')) {
                e.preventDefault();
            }
        });
        document.addEventListener('drop', function(e) {
            if (e.target.classList.contains('draggable')) {
                const tgtIdx = e.target.getAttribute('data-idx');
                let pinned = JSON.parse(localStorage.getItem('vizai_pinned_charts') || '[]');
                const [moved] = pinned.splice(dragSrcIdx, 1);
                pinned.splice(tgtIdx, 0, moved);
                localStorage.setItem('vizai_pinned_charts', JSON.stringify(pinned));
                renderDashboard();
            }
        });
        // Initial render
        renderDashboard();
    </script>
</body>
</html>
