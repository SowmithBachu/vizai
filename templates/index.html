<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VizAI - Upload Data</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #18191a !important; color: #f5f6fa; }
        .card { background-color: #23272b; color: #f5f6fa; }
        .form-control, .form-select { background-color: #23272b; color: #f5f6fa; border: 1px solid #444; }
        .btn-primary { background-color: #4f8cff; border: none; }
        .btn-primary:hover { background-color: #2563eb; }
        .alert { color: #fff; }
        .alert-danger { background-color: #c0392b; }
        .alert-warning { background-color: #e67e22; }
        .alert-info { background-color: #2980b9; }
        .btn-success { background-color: #27ae60; border: none; }
        .btn-success:hover { background-color: #219150; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">📊 VizAI - Upload Your Data</h2>
                        {% with messages = get_flashed_messages(with_categories=true) %}
                          {% if messages %}
                            {% for category, message in messages %}
                              <div class="alert alert-{{ category }}">{{ message }}</div>
                            {% endfor %}
                          {% endif %}
                        {% endwith %}
                        <form method="POST" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="file" class="form-label">Select Excel or CSV file</label>
                                <input class="form-control" type="file" id="file" name="file" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Upload & Continue</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
